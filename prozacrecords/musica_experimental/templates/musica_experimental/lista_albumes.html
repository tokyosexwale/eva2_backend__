{% extends 'core/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>🎵 Discografía de Música Experimental</h2>
    <!-- BOTÓN AGREGAR -->
    <a href="{% url 'crear_album' %}" class="btn btn-success">+ Agregar Álbum</a>
</div>

<!-- FORMULARIO DE BÚSQUEDA -->
<form class="row g-3 mb-4" method="get" action="{% url 'lista_albumes' %}">
    <div class="col-auto">
        <input class="form-control" type="search" name="q" value="{{ query }}" placeholder="Buscar por álbum o artista...">
    </div>
    <div class="col-auto">
        <button class="btn btn-primary" type="submit">Buscar</button>
    </div>
</form>

<div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
    {% for album in albumes %}
    <div class="col">
        <div class="card h-100 shadow-sm border-0 bg-dark text-white">
            <img src="{{ album.portada }}" class="card-img-top" alt="{{ album.titulo }}" style="height: 200px; object-fit: cover;" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x300/222222/ffffff?text=Experimental+Music';">
            <div class="card-body p-3">
                <h6 class="card-title text-truncate mb-1">{{ album.titulo }}</h6>
                <p class="card-text small text-muted mb-1">{{ album.artista.nombre }}</p>
                <span class="badge bg-primary mb-2">{{ album.genero }}</span>
            </div>
            <!-- BOTONES EDITAR Y ELIMINAR -->
            <div class="card-footer bg-transparent border-top-0 d-flex justify-content-between p-2">
                <a href="{% url 'editar_album' album.pk %}" class="btn btn-sm btn-outline-warning w-48">Modificar</a>
                <a href="{% url 'eliminar_album' album.pk %}" class="btn btn-sm btn-outline-danger w-48">Eliminar</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <p class="text-muted">No se encontraron registros.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
